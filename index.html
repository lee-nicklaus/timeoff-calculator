<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加班调休计算器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>加班调休计算器</h1>
        </header>

        <main>
            <form id="entry-form">
                <div class="form-control">
                    <label for="type">类型:</label>
                    <select id="type">
                        <option value="overtime">加班</option>
                        <option value="off-in-lieu">调休</option>
                    </select>
                </div>
                <div class="form-control">
                    <label for="date">日期:</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-control">
                    <label for="duration">时长 (小时):</label>
                    <input type="number" id="duration" placeholder="例如: 8" min="1" step="0.5" required>
                </div>
                <button type="submit">添加记录</button>
            </form>

            <ul id="entry-list">
                <!-- Entries will be dynamically inserted here -->
            </ul>

            <div id="summary">
                <h2>结余</h2>
                <p>剩余总时长: <span id="total-hours">0</span> 小时</p>
                <p>折合: <span id="total-days">0</span> 天</p>
            </div>

            <div id="data-management">
                <button id="export-btn">导出数据</button>
                <button id="import-btn">导入数据</button>
                <input type="file" id="import-file" accept=".json" style="display: none;">
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
